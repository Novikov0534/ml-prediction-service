version: "3.8"

services:
  ml-app:
    image: ghcr.io/novikov0534/ml-prediction-service/ml-app:latest
    container_name: ml-app
    env_file:
      - .env
    environment:
      DB_HOST: 10.10.10.101
      DB_NAME: ml_predictions
      DB_USER: ml_app
      DB_SSLMODE: require
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
