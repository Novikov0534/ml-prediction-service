groups:
- name: ml-service-alerts
  interval: 15s
  rules:
  - alert: MLServiceDown
    expr: up{job="ml-app"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: ML service unavailable for more than one minute
  - alert: HighPredictionLatency
    expr: histogram_quantile(0.95, sum by (le) (rate(ml_prediction_latency_seconds_bucket[5m]))) > 1
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Prediction p95 latency exceeds one second
  - alert: LowModelAccuracy
    expr: ml_model_accuracy{evaluation="stratified_cv5"} < 0.90
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Build-time cross-validation accuracy is below 90 percent
  - alert: DBPredictionErrors
    expr: increase(ml_db_errors_total[5m]) > 3
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: More than three database write failures in five minutes
  - alert: NoPredictionsReceived
    expr: sum(rate(ml_predictions_total[10m])) == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: No successful predictions during the observation window
